[package]
name = "core-store"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[dependencies]
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "migrate"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
parking_lot.workspace = true
thiserror.workspace = true
tracing.workspace = true
windows-dpapi = "0.2.0"
zeroize = { version = "1", features = ["zeroize_derive"] }
# 配置导出加密（M2 收口）：Argon2id 派生 + AES-256-GCM（版本沿 lockfile 既有）
argon2 = "0.6.0-rc.8"
aes-gcm = "0.11.0"
base64 = "0.22.1"
rand = "0.10"

[target.'cfg(windows)'.dependencies]
# PuTTY 注册表导入
winreg = "0.55.0"

[dev-dependencies]
anyhow.workspace = true
