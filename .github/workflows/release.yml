name: release

# 打 tag 发版：tag 必须与 crates/app/tauri.conf.json 的 version 一致（v0.3.4 ↔ 0.3.4）。
# 产物规范（轴一 1.2）：NSIS 安装包 + .sig（updater 签名）+ MSI + latest.json（updater 清单）
# + SHA256SUMS.txt；发布说明由 GitHub 自动生成（commit/PR 摘要），截图/GIF 发版后手动补。
#
# 所需 Secrets：TAURI_SIGNING_PRIVATE_KEY（minisign 私钥全文，对应 tauri.conf.json 的 pubkey；
# 本地副本在 %LOCALAPPDATA%/myssh/updater.key，丢失需重新生成并替换 pubkey——旧版本将无法升级）。

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      # beforeBuildCommand（tauri.conf.json）会跑前端 build，这里只需装依赖
      - run: npm ci --prefix app/ui
      - name: 构建并签名 NSIS/MSI 安装包
        working-directory: crates/app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npm --prefix ../../app/ui exec -- tauri build
      - name: 生成 SHA256 校验单
        shell: pwsh
        run: |
          $files = Get-ChildItem target/release/bundle -Recurse -File -Include *.exe, *.msi
          $lines = $files | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $($_.Name)"
          }
          $lines | Out-File -Encoding utf8 SHA256SUMS.txt
      - name: 生成 latest.json（updater 清单）
        shell: pwsh
        run: |
          $conf = Get-Content crates/app/tauri.conf.json -Raw | ConvertFrom-Json
          $ver = $conf.version
          $tag = "${{ github.ref_name }}"
          $setup = "mySSH_${ver}_x64-setup.exe"
          $sig = (Get-Content "target/release/bundle/nsis/$setup.sig" -Raw).Trim()
          $manifest = [ordered]@{
            version  = "v$ver"
            notes    = "See the release notes for details."
            pub_date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{
                signature = $sig
                url       = "https://github.com/xinchen2003/mySSH/releases/download/$tag/$setup"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Out-File -Encoding utf8 latest.json
      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.sig
            target/release/bundle/msi/*.msi
            SHA256SUMS.txt
            latest.json
