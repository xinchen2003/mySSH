name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # tauri.conf.json 的 frontendDist 指向 app/ui/dist，cargo 编译 app 前必须先产出前端
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      - run: npm ci --prefix app/ui && npm run build --prefix app/ui
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  app-release:
    # 验证 release 产物自包含（custom-protocol 内嵌资源，不依赖 devUrl）
    runs-on: windows-latest
    needs: [rust, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      - run: npm ci --prefix app/ui && npm run build --prefix app/ui
      - name: build app (release)
        run: cargo build --release -p app
      - name: build cli (release)
        run: cargo build --release -p cli
      - uses: actions/upload-artifact@v4
        with:
          name: myssh-bin
          path: |
            target/release/app.exe
            target/release/myssh-cli.exe
          retention-days: 7

  perf-bench:
    # Spike 压测套件软门槛：跑完上传结果，不阻断合并（阈值告警另接）
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      - run: npm ci --prefix spike/app && npm run build --prefix spike/app
      - run: cargo build --release --manifest-path spike/Cargo.toml
      - name: run spike suite
        run: |
          Start-Process -FilePath spike\target\release\spike-server.exe
          Start-Sleep -Seconds 2
          spike\target\release\spike-app.exe
      - uses: actions/upload-artifact@v4
        with:
          name: spike-results
          path: spike/results/*.json
          retention-days: 30

  perf-gate:
    # PR-18 性能门禁（PR 级微基准）：纯内存/回环、release、median。
    # 阈值按开发机首测 ×约 2 倍裕度校准；共享 Runner 性能未定标，
    # 先 continue-on-error 出报告积累数据（计划约束：禁止共享 Runner 硬失败
    # P95 类指标），稳定后再转硬门禁。
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: run perf gate
        run: node scripts/perf-gate.mjs

  e2e-linux:
    # 轴一 1.3：真机 OpenSSH 容器 E2E——连接/键入回显、SFTP 回环、known_hosts、su 密码应答
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 构建并启动 OpenSSH 容器
        run: |
          docker build -t myssh-e2e-sshd .github/e2e/sshd
          docker run -d --name sshd -p 2222:2222 myssh-e2e-sshd
          for i in $(seq 1 30); do
            if timeout 2 bash -c 'exec 3<>/dev/tcp/127.0.0.1/2222 && head -c 4 <&3 | grep -q SSH'; then
              echo "sshd ready"; break
            fi
            sleep 1
          done
      - name: 运行真机 E2E
        env:
          MYSSH_E2E_HOST: 127.0.0.1
          MYSSH_E2E_PORT: "2222"
          MYSSH_E2E_USER: tester
          MYSSH_E2E_PASSWORD: e2e-pass
          MYSSH_E2E_SU_PASSWORD: e2e-root
        run: cargo test -p core-ssh -p core-sftp --test e2e_sshd -- --nocapture

  e2e-windows-mcp:
    # MCP HTTP 面真机往返（ssh_exec / terminal_*）。vault 为 DPAPI → 必须 Windows；
    # MCP host key fail-closed → 预先用 ssh-keyscan 学入本机 sshd 密钥
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      - run: npm ci --prefix app/ui && npm run build --prefix app/ui
      - name: 启用 OpenSSH Server 与测试账号
        shell: pwsh
        run: |
          Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0
          Set-Service sshd -StartupType Automatic
          Start-Service sshd
          net user tester "E2e-Pass-123!" /add /expires:never
      - name: 预学习本机 sshd 主机密钥
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:LOCALAPPDATA\myssh" | Out-Null
          ssh-keyscan -t ed25519,ecdsa,rsa 127.0.0.1 | Out-File -Encoding ascii -Append "$env:LOCALAPPDATA\myssh\known_hosts"
      - name: 运行 MCP E2E
        env:
          MYSSH_E2E_HOST: 127.0.0.1
          MYSSH_E2E_PORT: "22"
          MYSSH_E2E_USER: tester
          MYSSH_E2E_PASSWORD: E2e-Pass-123!
        run: cargo test -p app e2e_ -- --nocapture
