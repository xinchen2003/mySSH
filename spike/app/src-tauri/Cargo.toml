[package]
name = "spike-app"
version = "0.1.0"
edition = "2021"

[lib]
name = "spike_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
# custom-protocol 必须显式开启：否则 tauri build.rs 把 dev=true 传给 tauri-build，
# release 也会去加载 devUrl 而非内嵌资源（实测踩中：vite 不在时窗口空白）
tauri = { version = "2.11", features = ["custom-protocol"] }
russh = { version = "0.62", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["full"] }
bytes = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.37"
socket2 = { version = "0.6", features = ["all"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
